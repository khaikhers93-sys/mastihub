<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MastiHub Login</title>
<style>
body{font-family:Arial;background:#f3f5f9;margin:0}
.box{max-width:400px;margin:70px auto;background:white;padding:25px;border-radius:20px;box-shadow:0 5px 20px #ddd}
h1{text-align:center;color:#6c2cff}
input,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box;border-radius:10px}
input{border:1px solid #ddd}
button{border:0;background:#6c2cff;color:white;font-size:17px}
a{color:#6c2cff}
</style>
</head>
<body>
<div class="box">
<h1>🎮 MastiHub</h1>
<h2>Login</h2>
<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p>Account नहीं है? <a href="/register">Register करें</a></p>
</div>
</body>
</html>
